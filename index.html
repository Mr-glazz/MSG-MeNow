<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Room Community Chat</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #1e1f22;
            color: #dbdee1;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar for Chat Rooms */
        .sidebar-rooms {
            width: 240px;
            background-color: #2b2d31;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #1f2023;
        }

        .sidebar-header {
            padding: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            background-color: #232428;
            color: #fff;
            border-bottom: 1px solid #1f2023;
        }

        .room-list {
            flex: 1;
            padding: 10px;
            list-style: none;
            overflow-y: auto;
        }

        .room-item {
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 4px;
            color: #949ba4;
            font-weight: 500;
            transition: background 0.2s, color 0.2s;
        }

        .room-item:hover {
            background-color: #35373c;
            color: #dbdee1;
        }

        .room-item.active {
            background-color: #404249;
            color: #fff;
        }

        /* Main Chat Window */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #313338;
        }

        .chat-header {
            height: 53px;
            padding: 0 20px;
            background-color: #313338;
            border-bottom: 1px solid #1f2023;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .room-title {
            font-weight: bold;
            color: #fff;
            font-size: 1.1rem;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message-row {
            display: flex;
            flex-direction: column;
        }

        .message-meta {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 4px;
        }

        .user-name {
            font-weight: 600;
            font-size: 0.95rem;
            color: #00b0f4;
            cursor: pointer;
        }

        .user-name:hover {
            text-decoration: underline;
        }

        .message-time {
            font-size: 0.75rem;
            color: #949ba4;
        }

        .message-text {
            font-size: 0.95rem;
            color: #dbdee1;
            line-height: 1.4;
            word-break: break-word;
        }

        /* Input Container */
        .chat-input-area {
            padding: 0 20px 24px 20px;
            background-color: #313338;
        }

        .input-wrapper {
            background-color: #383a40;
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 10px 15px;
        }

        .chat-input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: #dbdee1;
            font-size: 0.95rem;
        }

        .chat-input::placeholder {
            color: #80848e;
        }

        /* User Directory Sidebar */
        .sidebar-users {
            width: 200px;
            background-color: #2b2d31;
            display: flex;
            flex-direction: column;
            border-left: 1px solid #1f2023;
        }

        .user-list {
            padding: 15px;
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .user-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: #949ba4;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #23a55a;
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <!-- Rooms Sidebar -->
    <div class="sidebar-rooms">
        <div class="sidebar-header">💬 Chat Rooms</div>
        <ul class="room-list">
            <li class="room-item active" onclick="switchRoom('General Lobby')">🌐 General Lobby</li>
            <li class="room-item" onclick="switchRoom('Gaming Zone')">🎮 Gaming Zone</li>
            <li class="room-item" onclick="switchRoom('Flirt & Dating')">❤️ Flirt & Dating</li>
            <li class="room-item" onclick="switchRoom('Music Lounge')">🎵 Music Lounge</li>
        </ul>
    </div>

    <!-- Main Chat Window -->
    <div class="chat-main">
        <div class="chat-header">
            <span class="room-title" id="currentRoomTitle">Lobby</span>
            <span style="font-size: 0.85rem; color: #23a55a;">● 1,420 Online</span>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <!-- Messages render here dynamically -->
        </div>

        <div class="chat-input-area">
            <div class="input-wrapper">
                <input type="text" id="chatInput" class="chat-input" placeholder="Message this room..." autocomplete="off">
            </div>
        </div>
    </div>

    <!-- Active Users Sidebar -->
    <div class="sidebar-users">
        <div class="sidebar-header">Online Users</div>
        <ul class="user-list">
            <li class="user-item"><span class="status-dot"></span> Admin_Spin</li>
            <li class="user-item"><span class="status-dot"></span> CyberKnight</li>
            <li class="user-item"><span class="status-dot"></span> PixelQueen</li>
            <li class="user-item"><span class="status-dot"></span> RetroGamer</li>
        </ul>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const currentRoomTitle = document.getElementById('currentRoomTitle');

        // Dynamic multi-room state tracking
        let currentRoom = "General Lobby";
        const roomData = {
            "General Lobby": [
                { user: "Admin_Spin", text: "Welcome to the Spin Platform! Feel free to switch channels.", time: "9:30 PM" }
            ],
            "Gaming Zone": [
                { user: "CyberKnight", text: "Anyone down for an MMO raid later tonight?", time: "9:32 PM" }
            ],
            "Flirt & Dating": [
                { user: "PixelQueen", text: "Hey! Let's get to know each other. Where is everyone from?", time: "9:28 PM" }
            ],
            "Music Lounge": [
                { user: "RetroGamer", text: "Currently listening to synthwave vibes. What's your playlist look like?", time: "9:35 PM" }
            ]
        };

        function renderMessages() {
            chatMessages.innerHTML = '';
            const messages = roomData[currentRoom] || [];
            messages.forEach(msg => {
                const row = document.createElement('div');
                row.className = 'message-row';
                row.innerHTML = `
                    <div class="message-meta">
                        <span class="user-name">${msg.user}</span>
                        <span class="message-time">${msg.time}</span>
                    </div>
                    <div class="message-text">${escapeHTML(msg.text)}</div>
                `;
                chatMessages.appendChild(row);
            });
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function switchRoom(roomName) {
            currentRoom = roomName;
            currentRoomTitle.innerText = `# ${roomName}`;
            
            // Adjust active CSS states
            document.querySelectorAll('.room-item').forEach(item => {
                if(item.innerText.includes(roomName)) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
            
            renderMessages();
        }

        function sendMessage() {
            const text = chatInput.value.trim();
            if (text === '') return;

            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            // Push to memory array
            roomData[currentRoom].push({
                user: "You",
                text: text,
                time: timeStr
            });

            chatInput.value = '';
            renderMessages();
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Initial launch configuration
        switchRoom('General Lobby');
    </script>
</body>
</html>
