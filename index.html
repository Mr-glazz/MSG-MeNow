<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Chat Room</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 80vh;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: #0084ff;
            color: white;
            padding: 15px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f9f9f9;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.4;
            position: relative;
            word-wrap: break-word;
        }

        .message.received {
            background: #e4e6eb;
            color: #050505;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.sent {
            background: #0084ff;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message-user {
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 4px;
            color: #65676b;
        }

        .message.sent .message-user {
            color: #e0f0ff;
            text-align: right;
        }

        .chat-input-area {
            padding: 15px;
            background: white;
            border-top: 1px solid #e4e6eb;
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ccd0d5;
            border-radius: 24px;
            outline: none;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        .chat-input:focus {
            border-color: #0084ff;
        }

        .send-btn {
            background: #0084ff;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background: #006bc6;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <span>Public Chat Room</span>
            <span style="font-size: 0.8rem; font-weight: normal; background: #28a745; padding: 4px 8px; border-radius: 12px;">Live Simulation</span>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message received">
                <div class="message-user">Alex</div>
                Welcome to the public chat space! Type a message below to try it out.
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="chatInput" class="chat-input" placeholder="Type a message..." autocomplete="off">
            <button id="sendBtn" class="send-btn">Send</button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');

        const botReplies = [
            "Hey there! Welcome to the chat.",
            "That's awesome! Anyone else online right now?",
            "I'm building a project just like this one.",
            "Make sure to connect this code to a backend database to make it truly public!",
            "Looks clean! Let me know if you need help adding Firebase or WebSockets."
        ];

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function sendMessage() {
            const text = chatInput.value.trim();
            if (text === '') return;

            // Create sent message HTML
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message sent';
            messageDiv.innerHTML = `<div class="message-user">You</div>${escapeHTML(text)}`;
            chatMessages.appendChild(messageDiv);
            
            chatInput.value = '';
            scrollToBottom();

            // Simulate a reply after 1.5 seconds
            setTimeout(() => {
                simulateReply();
            }, 1500);
        }

        function simulateReply() {
            const randomReply = botReplies[Math.floor(Math.random() * botReplies.length)];
            const randomUsers = ['Sam', 'Jordan', 'Taylor', 'Casey'];
            const randomUser = randomUsers[Math.floor(Math.random() * randomUsers.length)];

            const messageDiv = document.createElement('div');
            messageDiv.className = 'message received';
            messageDiv.innerHTML = `<div class="message-user">${randomUser}</div>${randomReply}`;
            chatMessages.appendChild(messageDiv);
            scrollToBottom();
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Initial scroll configuration
        scrollToBottom();
    </script>
</body>
</html>
